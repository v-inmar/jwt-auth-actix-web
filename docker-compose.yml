services:
  db:
    image: postgres:16
    restart: always
    environment:
      # These match your .env values
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # This override is crucial: 'db' is the hostname in the docker network
      DATABASE_URL: postgres://postgres:mysecretpassword@db:5432/appdb
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      JWT_ACCESS_SECRET: changeme123
      JWT_REFRESH_SECRET: alsochangeme123
      ACCESS_TOKEN_EXPIRATION_MINUTES: 5
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
    depends_on:
      db:
        condition: service_healthy